[project]
name = "ronin-mcp"
version = "0.1.0"
description = "Ronin MCP - aggregating facade over agent-bus, loop-engine, work-folder, and pump state"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    # Needed only to run the agent-bus round-trip integration tests when the
    # agent-bus source tree is reachable on the filesystem.
    "python-ulid>=2.0.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
ronin-mcp = "ronin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ronin_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
timeout = 60
testpaths = ["tests"]
